name: Build and sign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # create the release / upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build portable + installer
        run: npx electron-builder --win portable nsis --publish never

      - name: Zip artifacts for SignPath
        run: |
          mkdir unsigned
          copy "dist\Flicker*.exe" unsigned\
          Compress-Archive -Path unsigned\* -DestinationPath unsigned.zip
        shell: pwsh

      # Uses the SignPath PowerShell module, which calls the plain REST API
      # directly (same one the web dashboard uses) rather than the GitHub
      # Actions connector — the connector needs a Trusted Build System, which
      # is not part of the free trial and returns a 503 for every request.
      - name: Sign artifact
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          Install-Module -Name SignPath -Force -Scope CurrentUser
          Import-Module SignPath
          Submit-SigningRequest `
            -InputArtifactPath "unsigned.zip" `
            -ApiToken "${{ secrets.SIGNPATH_API_TOKEN }}" `
            -OrganizationId "${{ secrets.SIGNPATH_ORG_ID }}" `
            -ProjectSlug "flicker" `
            -SigningPolicySlug "test-signing" `
            -ArtifactConfigurationSlug "initial" `
            -OutputArtifactPath "signed.zip" `
            -WaitForCompletion
          Expand-Archive -Path signed.zip -DestinationPath signed

      - name: Publish signed binaries to the release
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: signed/*.exe

      - name: Publish unsigned binaries to the release
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ENABLED != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
