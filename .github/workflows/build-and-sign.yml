name: Build and sign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # create the release / upload assets
      actions: read     # let SignPath read the run and fetch the artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build portable + installer
        run: npx electron-builder --win portable nsis --publish never

      - name: Zip artifacts for SignPath
        run: |
          mkdir unsigned
          copy "dist\Flicker*.exe" unsigned\
          Compress-Archive -Path unsigned\* -DestinationPath unsigned.zip
        shell: pwsh

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: unsigned.zip

      # Signing goes through SignPath's GitHub Actions connector, which needs a
      # Trusted Build System. That is not part of the free trial subscription —
      # the connector answers every request with a 503 until the account is
      # entitled. Once the SignPath Foundation open-source plan is approved,
      # set the repository variable SIGNPATH_ENABLED to "true" to switch this on.
      - name: Submit signing request
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        id: sign
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORG_ID }}"
          project-slug: "flicker"
          signing-policy-slug: "test-signing"
          artifact-configuration-slug: "initial"
          github-artifact-id: "${{ steps.upload-unsigned.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: "signed"

      - name: Publish signed binaries to the release
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: signed/*.exe

      - name: Publish unsigned binaries to the release
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ENABLED != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
